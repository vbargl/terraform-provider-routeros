name: Prepare release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - shell: nu --no-config-file {0}
        run: |
          if $env.RELEASE_VERSION !~ '^[0-9]+\.[0-9]+\.[0-9]+$' {
            error make {msg: 'Expected a version in X.Y.Z format'}
          }
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: release --snapshot --clean
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: nu --no-config-file {0}
        run: |
          let prefix = $"terraform-provider-routeros_($env.RELEASE_VERSION)"
          cp terraform-registry-manifest.json (['dist' $"($prefix)_manifest.json"] | path join)
          cd dist
          ^sha256sum -c $"($prefix)_SHA256SUMS"
      - uses: actions/upload-artifact@v6
        with:
          name: terraform-provider-routeros-packages
          path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS
