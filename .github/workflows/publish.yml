name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - shell: nu --no-config-file {0}
        run: |
          if $env.RELEASE_VERSION !~ '^[0-9]+\.[0-9]+\.[0-9]+$' {
            error make {msg: 'Expected a version in X.Y.Z format'}
          }
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: release --snapshot --clean
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: nu --no-config-file {0}
        run: |
          let prefix = $"terraform-provider-routeros_($env.RELEASE_VERSION)"
          cp terraform-registry-manifest.json (['dist' $"($prefix)_manifest.json"] | path join)
          cd dist
          ^sha256sum -c $"($prefix)_SHA256SUMS"
      - uses: actions/upload-artifact@v6
        with:
          name: terraform-provider-routeros-packages
          path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS

  publish:
    if: github.ref == 'refs/heads/main'
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - uses: actions/download-artifact@v7
        with:
          name: terraform-provider-routeros-packages
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: nu --no-config-file {0}
        run: |
          let tag = $"v($env.RELEASE_VERSION)"
          let prefix = $"terraform-provider-routeros_($env.RELEASE_VERSION)"
          cd dist
          let checksums = $"($prefix)_SHA256SUMS"
          ^sha256sum --check --strict $checksums
          let assets = (glob $"($prefix)_*.zip" | append [$"($prefix)_manifest.json" $checksums])

          # A normal push rejects an existing tag that points to another commit.
          ^git push origin $"($env.GITHUB_SHA):refs/tags/($tag)"
          ^gh release create $tag ...$assets --repo $env.GITHUB_REPOSITORY --verify-tag --generate-notes
